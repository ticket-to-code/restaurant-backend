version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=DATABASE_URL
    networks:
      - shared_network
    restart: unless-stopped

networks:
  shared_network:
    external: true
